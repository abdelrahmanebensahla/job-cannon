name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push that only refreshes the job corpus doesn't need a full type-check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The strictest check in the project: full type-check plus bundling.
      # Runs without secrets — the db client is a lazy Proxy and every other
      # integration reads its key at request time, not module load.
      - name: Build
        run: npm run build
