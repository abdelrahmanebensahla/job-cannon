name: Nightly scrape

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Exits non-zero if any source drops below its health floor or the
      # corpus collapses, which stops the commit step below from running.
      # That is the point: a silently thinning jobs.json used to look green.
      - run: npm run scrape

      - name: Commit jobs.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/jobs-meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh jobs.json"
            git push
          else
            echo "No changes to jobs.json"
          fi
